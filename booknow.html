<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leropong Guest House - Book Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="outside2.jpeg" alt="Leropong Guest House Logo" class="header-logo">
    </div>
    <h1>Leropong Guest House</h1>
    <p class="motto">Where Comfort Meets Tranquility</p>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rooms.html">Rooms</a></li>
        <li><a href="booknow.html" class="active">Book Now</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="specials.html">Specials</a></li>
    </ul>
</nav>

<main class="booking-page-wrapper">
    
    <h2 class="w3-main-title">DONT BE SHY! BOOK NOW!</h2>

    <div class="split-booking-widget">
        
        <div class="booking-form-panel">
            <div class="panel-header-tab">
                <h3>BOOKING</h3>
            </div>
            
            <form action="#" method="POST" class="w3-internal-form" onsubmit="alert('Reservation request processed successfully! We look forward to hosting you.'); return false;">
                
                <div class="w3-input-group">
                    <label for="bname">Name/Leina :</label>
                    <input type="text" id="bname" required placeholder="Your name">
                </div>

                <div class="w3-input-group">
                    <label for="bemail">Email :</label>
                    <input type="email" id="bemail" required placeholder="Your email">
                </div>

                <div class="w3-input-group">
                    <label for="checkin">Check In Date :</label>
                    <input type="date" id="checkin" required>
                </div>

                <div class="w3-input-group">
                    <label for="checkout">Check Out Date :</label>
                    <input type="date" id="checkout" required>
                </div>

                <div class="w3-input-group">
                    <label for="bguests">Number of Guests :</label>
                    <select id="bguests" required>
                        <option value="" disabled selected hidden>Select number of guests</option>
                        <option value="1">1 Guest</option>
                        <option value="2">2 Guests</option>
                        <option value="3">3 Guests</option>
                        <option value="4">4 Guests</option>
                        <option value="5+">5+ Group</option>
                    </select>
                </div>

                <button type="submit" class="btn-w3-submit">BOOK NOW</button>
            </form>
        </div>

        <div class="booking-image-panel">
            <img src="images/guesthouse-pool.jpg" alt="Leropong Guest House Property View">
        </div>

    </div>

</main>

<footer>
    <p>&copy; 2026 Leropong Guest House| Anele-Leteng Mosanako (BIDA25-078 Y1G2) </p>
</footer>

</body>
</html>
